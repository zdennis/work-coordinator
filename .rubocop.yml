plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - "vendor/**/*"
    - "db/migrate/*.rb"

Style/Documentation:
  Enabled: false

Style/MixinUsage:
  Exclude:
    - "script/**/*"

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Style/StringLiterals:
  EnforcedStyle: double_quotes

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "bin/work-coordinator"

Metrics/ParameterLists:
  Max: 8

Metrics/MethodLength:
  Max: 15

Metrics/ClassLength:
  Max: 150

Layout/LineLength:
  Max: 120

RSpec/ExampleLength:
  Max: 20

RSpec/MultipleExpectations:
  Max: 5

RSpec/MultipleMemoizedHelpers:
  Max: 8

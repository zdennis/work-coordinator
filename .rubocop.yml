plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - "vendor/**/*"
    - "db/migrate/*.rb"

Style/Documentation:
  Enabled: false

Style/FormatStringToken:
  Exclude:
    - "lib/work_coordinator/config.rb"

Style/MixinUsage:
  Exclude:
    - "script/**/*"

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Style/StringLiterals:
  EnforcedStyle: double_quotes

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "bin/work-coordinator"

Metrics/ParameterLists:
  Max: 8
  # Constructor injection means every collaborator is a keyword argument; the
  # positional-ordering problem this cop guards against does not apply.
  CountKeywordArgs: false

Metrics/MethodLength:
  Max: 15

Metrics/ClassLength:
  Max: 150
  # The composition root grows one attr_reader and one builder per collaborator.
  # Length here reflects how many things the app wires, not a class doing too much.
  Exclude:
    - "lib/work_coordinator/container.rb"

Layout/LineLength:
  Max: 120

RSpec/ExampleLength:
  Max: 20

RSpec/MultipleExpectations:
  Max: 5
  Exclude:
    - "spec/work_coordinator/integration/**/*"

RSpec/MultipleMemoizedHelpers:
  Max: 9
  Exclude:
    - "spec/work_coordinator/integration/**/*"

# End-to-end specs describe a path through several classes, not one class.
RSpec/DescribeClass:
  Exclude:
    - "spec/work_coordinator/integration/**/*"
